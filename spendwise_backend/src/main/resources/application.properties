spring.application.name=SpendWise
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spendwise_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.indent-output=true

# Set JWT_SECRET to a strong Base64-encoded secret (at least 32 bytes).
# The fallback is for local development only; replace it before deployment.

